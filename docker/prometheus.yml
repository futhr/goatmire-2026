global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/goatmire-rules.yml

scrape_configs:
  - job_name: goatmire-engine
    static_configs:
      - targets: ["engine:9568"]

  # DNS service discovery picks up every simulator replica as it is scaled,
  # so `--scale simulator=8` needs no change here.
  - job_name: goatmire-simulator
    dns_sd_configs:
      - names: ["tasks.simulator", "simulator"]
        type: A
        port: 9568

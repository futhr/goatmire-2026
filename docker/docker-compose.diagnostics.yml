# Stage profile: Phoenix, ExMaude, BeamLens, Codex, and Ollama stay on the
# laptop host. Containers provide only the MQTT wire and simulated devices.
name: goatmire-diagnostics

services:
  broker:
    image: eclipse-mosquitto:2.1.2-alpine
    ports: ["127.0.0.1:1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -q 0 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  simulator:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: simulator
    depends_on:
      broker:
        condition: service_healthy
    mem_limit: 384m
    cpus: 2.0

  # The repo is mounted read-only so the notebooks' Mix.install path resolves
  # in-container; the first notebook run fetches and compiles into the
  # container's cache, so warm it during rehearsal, not on stage.
  livebook:
    image: ghcr.io/livebook-dev/livebook:0.19.9
    environment:
      LIVEBOOK_TOKEN_ENABLED: "false"
      LIVEBOOK_IP: 0.0.0.0
    volumes:
      - ..:/data/goatmire:ro
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1024m

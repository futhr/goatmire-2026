global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/goatmire-rules.yml

scrape_configs:
  - job_name: goatmire-host-engine
    static_configs:
      - targets: ["host.docker.internal:9568"]

  - job_name: goatmire-simulator
    dns_sd_configs:
      - names: ["tasks.simulator", "simulator"]
        type: A
        port: 9568

name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  canonical-gate:
    name: canonical quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.5.0.6"
          elixir-version: "1.19.6"

      - name: Restore Mix and PLT cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}

      - name: Install locked dependencies
        run: mix deps.get --check-locked

      - name: Install the pinned Maude interpreter
        run: mix maude.install --version 3.5.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run the canonical repository gate
        run: mix check --no-retry

      - name: Exercise local peer boot and a real-interpreter wear interval
        run: |
          mix test --include manual test/goatmire/local_cluster_test.exs
          SOAK_SECONDS=30 mix test.soak

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: cover/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  dashboard-e2e:
    name: dashboard E2E (Chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.5.0.6"
          elixir-version: "1.19.6"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.24.0"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: assets/pnpm-lock.yaml

      - name: Restore Mix cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: e2e-mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}

      - name: Install locked dependencies
        run: mix deps.get --check-locked

      - name: Install Playwright
        run: pnpm --dir assets install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: pnpm --dir assets exec playwright install --with-deps chromium

      - name: Install the pinned Maude interpreter
        run: mix maude.install --version 3.5.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Exercise the connected responsive dashboards
        run: mix test.e2e

  container-build:
    name: release container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build engine and simulator releases
        run: |
          docker build -f docker/Dockerfile --target engine -t goatmire-engine:check .
          docker build -f docker/Dockerfile --target simulator -t goatmire-simulator:check .
      - name: Boot releases against a real broker
        run: scripts/smoke-containers.sh
      - name: Build and exercise the independent notebook runtime
        run: |
          docker build -f docker/Dockerfile --target livebook -t goatmire-livebook:check .
          scripts/smoke-livebook.sh

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-credentials:
    name: no credential surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This demo is supposed to run from a cold clone with no account and no
      # token. A credential appearing in a tracked file is not only a leak —
      # it means the demo has quietly grown a dependency the audience cannot
      # reproduce, which is the premise the whole talk rests on.
      - name: Scan tracked files for API keys and bearer tokens
        run: |
          set -euo pipefail

          PATTERN='(sk-[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9._~+/-]{24,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,})'

          hits=$(
            git grep -nE "$PATTERN" \
              -- ':!.github/workflows/secret-scan.yml' \
                 ':!scripts/pre-commit-secret-scan.sh' \
              || true
          )

          if [ -n "$hits" ]; then
            echo "::error::Detected credential-shaped strings in tracked files."
            echo "$hits"
            echo
            echo "Revoke the credential, remove it from the repo, and rewrite history if it was ever pushed."
            exit 1
          fi

          echo "OK — no credential-shaped strings in tracked files."

  gitleaks:
    name: gitleaks broad-spectrum scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Scenario 4 alternate layout — the generated-rules beat only.
#
# Promotes the command line to a larger share of the screen so the typing and
# the conflict trace are legible from the back row.
session_name: goatmire-scenario4
windows:
  - window_name: generated-rules
    layout: main-vertical
    panes:
      - focus: true
        shell_command:
          - "clear && echo 'mix goatmire.ai \"...\"'"

      - shell_command:
          - "watch -n 2 'curl -s http://localhost:9568/metrics | grep -E \"goatmire_verify|ex_maude_ai\"'"

      - shell_command:
          - "iex -S mix run -e 'Application.ensure_all_started(:observer_cli); :observer_cli.start()'"

# tmuxp session for the on-stage demo. Loaded by `make stage-tmux` or by hand
# after `mix goatmire.health` reports a reachable interpreter.
#
# The audience sees the dashboard on the projector via the laptop's HDMI.
# These panes are the speaker's confidence monitor and the terminal beats.
session_name: goatmire-demo
windows:
  - window_name: demo
    layout: tiled
    panes:
      # Top-left — the Phoenix server. Also where deploy/verify log lines
      # appear, which is useful when a scenario misbehaves and the speaker
      # needs to see why without leaving the stage.
      - shell_command:
          - "mix phx.server"

      # Top-right — engine and fleet health, refreshed. Four facts:
      # interpreter, transport, fleet, engine. If the interpreter goes away
      # mid-talk, this is where it shows first.
      - shell_command:
          - "watch -n 2 'curl -s http://localhost:4000/api/health | python3 -m json.tool'"

      # Bottom-left — BEAM observer. During the storm the audience can watch
      # the device processes and the message queues move.
      - shell_command:
          - "iex -S mix run -e 'Application.ensure_all_started(:observer_cli); :observer_cli.start()'"

      # Bottom-right — the speaker's command line. Scenarios 1–5 and the
      # storm are driven from here.
      - focus: true
        shell_command:
          - "clear && echo 'mix goatmire.scenario 1 | 2 | 3 | 4 | 5   ·   mix goatmire.storm --compare'"
